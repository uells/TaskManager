services:
  db:
    image: postgres:16-alpine
    container_name: tasks_postgres_dev
    restart: always
    # Подключаем файл с переменными окружения
    env_file:
      - .env
    environment:
      # Эти переменные Postgres ищет внутри контейнера
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Именованный том для надежного хранения данных
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_dev: